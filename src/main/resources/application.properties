spring.application.name=demo

# 4주차 : MySQL 연결 정보 (기본 포트 3306, 데이터베이스 spring)
spring.datasource.url=jdbc:mysql://localhost:3306/spring?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# DB 비밀번호는 GitHub(공개 저장소)에 올라가지 않도록 secret.properties 에 따로 둔다.
# secret.properties 는 .gitignore 처리되어 있음. 내용 예 : spring.datasource.password=비밀번호
spring.config.import=optional:classpath:secret.properties
